<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Alertes et Notifications</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>Alertes et Notifications</header>
<div class="container">

    <div class="card">
        <h2>Alertes en Temps Réel</h2>
        <table>
            <tr><th>Heure</th><th>Priorité</th><th>Type</th><th>Statut</th><th>Action</th></tr>
            <tr><td>14:45</td><td class="critical">Critique</td><td>Machine A3 arrêtée</td><td>Non résolu</td><td><button class="resolve">Résoudre</button></td></tr>
            <tr><td>14:35</td><td class="warning">Avertissement</td><td>Opérateur B Inactif</td><td>En cours</td><td><button class="warning">In Progress</button></td></tr>
            <tr><td>12:15</td><td class="info">Info</td><td>Opérateur D absent</td><td>Résolu</td><td><button>Assigner</button></td></tr>
        </table>
    </div>

</div>
</body>
</html>
