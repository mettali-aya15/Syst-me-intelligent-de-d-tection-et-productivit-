<!-- Container principal Admin -->
<div class="admin-layout">
  
  <!-- Navbar professionnelle -->
  <nav class="admin-navbar">
    <div class="navbar-container">
      <!-- Logo -->
      <div class="navbar-brand">
        <span class="brand-icon">📊</span>
        <div class="brand-text">
          <span class="brand-name">CAMIA Factory</span>
          <span class="brand-tagline">Analyse Intelligente</span>
        </div>
      </div>

      <!-- Menu Navigation -->
      <ul class="navbar-menu">
        <li class="nav-item">
          <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">🏠</span>
            <span>Tableau de bord</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/kpi" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">📊</span>
            <span>Indicateurs clés de performance (KPI)</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/videos" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">🎥</span>
            <span>Vidéos</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/admin/notifications" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">🔔</span>
            <span>Notifications</span>
            <span class="nav-badge">3</span>
          </a>
        </li>
      </ul>

      <!-- Section utilisateur -->
      <div class="navbar-user">
        <div class="user-profile">
          <div class="user-avatar">AD</div>
          <div class="user-info">
            <span class="user-name">Administrateur</span>
            <span class="user-role">Admin</span>
          </div>
        </div>
        <button class="btn-logout" (click)="logout()">
          <span class="logout-icon">🚪</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenu principal -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>

</div>
