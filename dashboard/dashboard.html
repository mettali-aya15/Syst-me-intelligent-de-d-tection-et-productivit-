<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Dashboard Usine - Productivité</title>
<style>
/* Style global */
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #f4f6f8;
    color: #333;
}

header {
    background-color: #2c3e50;
    color: #fff;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 10px;
}

.dashboard-image {
    width: 100%;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* Zones KPIs fictives autour */
.kpi-row {
    display: flex;
    justify-content: space-between;
    margin: 20px 0;
}

.kpi-card {
    background-color: #fff;
    flex: 1;
    margin: 0 10px;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    text-align: center;
}

.kpi-card h3 {
    margin: 0 0 10px 0;
    color: #34495e;
}

.kpi-card p {
    font-size: 20px;
    font-weight: bold;
    margin: 0;
    color: #2c3e50;
}

@media(max-width: 768px){
    .kpi-row {
        flex-direction: column;
    }
    .kpi-card {
        margin: 10px 0;
    }
}
</style>
</head>
<body>

<header>Dashboard Usine - Productivité</header>

<div class="container">

    <!-- Zone KPIs -->
    <div class="kpi-row">
        <div class="kpi-card">
            <h3>Employés Actifs</h3>
            <p>24</p>
        </div>
        <div class="kpi-card">
            <h3>Machines en Marche</h3>
            <p>12</p>
        </div>
        <div class="kpi-card">
            <h3>Production / Jour</h3>
            <p>450 unités</p>
        </div>
        <div class="kpi-card">
            <h3>Alertes Critiques</h3>
            <p>2</p>
        </div>
    </div>

    <!-- Mockup graphique -->
    <img src="A_digital_mockup_displays_a_Productivity_Monitorin.png" alt="Mockup Dashboard" class="dashboard-image">

</div>

</body>
</html>
